     PAGE-SPECIFIC SCRIPT
============================= -->
<script>
async function loadPadyam() {
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");

    const shatakaluRes = await fetch("data/shatakalu.json");
    const shatakalu = await shatakaluRes.json();

    if (!type || !shatakalu[type]) {
        document.getElementById("padyamContent").innerHTML =
            "<p>Invalid padyam type.</p>";
        return;
    }

    const meta = shatakalu[type];
    const title = `${meta.telugu} — ${meta.english}`;

    // Update breadcrumb
    document.getElementById("breadcrumbTitle").textContent = title;

    const res = await fetch(`data/${type}.json`);
    const data = await res.json();

    const container = document.getElementById("padyamContent");

    container.innerHTML = `
        <h1 class="page-title">${title}</h1>
        ${meta.author ? `<p class="modules-subtitle">${meta.author}</p>` : ""}
    `;

    if (!Object.keys(data).length) {
        container.innerHTML += `
            <div class="rachana-empty">
                <p>పద్యాలు త్వరలో వస్తాయి — Verses coming soon. Check back later!</p>
            </div>
        `;
        return;
    }

    Object.keys(data).forEach(key => {
        const p = data[key];

        const linesHTML = p.lines.map(line => `<div>${line}</div>`).join("");
        const meaningHTML = p.meaning.map(m => `<li>${m}</li>`).join("");

        container.innerHTML += `
            <div class="padyam-block">
                <h3>${p.title}</h3>

                <div class="padyam-lines">
                    ${linesHTML}
                </div>

                <div class="audio-player" data-src="../assets/audio/${p.audio}">
                    <button class="play-btn">▶</button>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                    <span class="time-label">0:00</span>
                </div>

                <h4>Meaning</h4>
                <ul class="meaning-list">
                    ${meaningHTML}
                </ul>

                <p class="story-moral"><strong>Moral:</strong> ${p.moral}</p>
            </div>
        `;
    });

    if (window.initAudioPlayers) window.initAudioPlayers();
}

document.addEventListener("DOMContentLoaded", loadPadyam);
</script>
