<script src="../assets/js/script.js"></script>

<script>
const TYPE_META = {
    samasya: {
        title: "సమస్యా పూరణం — Samasya Puranam",
        subtitle: "A challenging line is given; the poet completes it into a full verse where the line fits meaningfully.",
        breadcrumb: "Samasya Puranam",
        challengeLabel: "సమస్య — The Challenge Line",
        dataFile: "data/samasya.json",
        challengeField: "samasya"
    },
    saametha: {
        title: "సామెత పద్యాలు — Saametha Padyalu",
        subtitle: "An English proverb, rendered into a Telugu padyam with proper chandassu.",
        breadcrumb: "Saametha Padyalu",
        challengeLabel: "English Proverb",
        dataFile: "data/saametha.json",
        challengeField: "proverb"
    }
};

async function loadRachana() {
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");
    const meta = TYPE_META[type];

    const container = document.getElementById("rachanaContent");

    if (!meta) {
        container.innerHTML = "<p>Invalid type.</p>";
        return;
    }

    document.getElementById("breadcrumbType").textContent = meta.breadcrumb;
    document.title = meta.title;

    container.innerHTML = `
        <h1 class="page-title">${meta.title}</h1>
        <p class="modules-subtitle">${meta.subtitle}</p>
    `;

    try {
        const res = await fetch(meta.dataFile);
        const data = await res.json();
        const keys = Object.keys(data);

        if (!keys.length) {
            container.innerHTML += `
                <div class="rachana-empty">
                    <p>కొత్త రచనలు త్వరలో వస్తాయి — New verses coming soon. Check back later!</p>
                </div>
            `;
            return;
        }

        keys.forEach(key => {
            const item = data[key];
            const linesHTML = (item.lines || []).map(line => `<div>${line}</div>`).join("");

            const audioHTML = item.audio ? `
                <div class="audio-player" data-src="audio/${item.audio}">
                    <button class="play-btn">▶</button>
                    <div class="progress-container"><div class="progress-bar"></div></div>
                    <span class="time-label">0:00</span>
                </div>
            ` : "";

            container.innerHTML += `
                <div class="padyam-block fade-slide" id="${key}">
                    <div class="rachana-challenge">
                        <span class="challenge-label">${meta.challengeLabel}</span>
                        ${item[meta.challengeField] || ""}
                    </div>

                    <div class="padyam-lines">
                        ${linesHTML}
                    </div>

                    ${audioHTML}

                    ${item.meaning ? `<p>${item.meaning}</p>` : ""}

                    <div class="rachana-meta">
                        ${item.chandassu ? `<span class="chandassu-tag">${item.chandassu}</span>` : ""}
                        ${item.poet ? `<span class="poet-credit">— ${item.poet}</span>` : ""}
                    </div>
                </div>
            `;
        });

        if (window.initAudioPlayers) window.initAudioPlayers();

    } catch (e) {
        console.error(e);
        container.innerHTML += "<p>Unable to load content right now.</p>";
    }
}

document.addEventListener("DOMContentLoaded", loadRachana);
</script>

</body>
